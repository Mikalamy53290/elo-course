name: Pack ELO COURSE
on:
  push:
    branches:
      - gestion-courses-corrections-2026-11-16
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gestion-courses-corrections-2026-11-16
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          inline = [part for part in scripts if part.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/elo-inline.js").write_text("\n;\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/elo-inline.js
      - name: Prepare ZIP
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          mkdir -p dist/supabase
          cp supabase/runner_duel_challenges.sql dist/supabase/runner_duel_challenges.sql
          cd dist
          zip -9 -r ELO-COURSE-gestion-courses-corrections-2026-11-16.zip index.html supabase/runner_duel_challenges.sql
      - uses: actions/upload-artifact@v4
        with:
          name: ELO-COURSE-gestion-courses-corrections-2026-11-16
          path: dist/ELO-COURSE-gestion-courses-corrections-2026-11-16.zip
          if-no-files-found: error
          retention-days: 7
